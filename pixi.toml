[workspace]
name = "robotics-basics"
version = "0.1.0"
description = "ROS 2 Jazzy + RViz2 playground, managed with pixi (RoboStack)"
authors = ["robin <2021guneet@gmail.com>"]
# conda-forge first, RoboStack second: RoboStack only supplies the ros-* packages
# and expects the rest of the stack to resolve from conda-forge.
channels = ["conda-forge", "robostack-jazzy"]
platforms = ["osx-arm64"]

[dependencies]
# ROS 2 Jazzy Jalisco (LTS, supported to May 2029) is built against CPython 3.12
# on RoboStack — that pin is what rclpy's compiled extensions link against, so it
# is not a free choice.
python = "3.12.*"
ros-jazzy-desktop = "*"

# Build tooling for the colcon workspace under src/.
colcon-common-extensions = "*"
# setuptools 80 removed the `develop` command that ament_python packages rely on
# for `colcon build --symlink-install`; newer than that breaks editable builds.
setuptools = ">=68,<80"
# ROS 2 Jazzy ships a `launch_testing` pytest plugin whose hooks use the `path`
# argument pytest 8 removed, so anything >=8 fails at plugin-load time.
pytest = ">=7,<8"
pip = "*"

[tasks]
# Build every package in src/. --symlink-install means edits to Python sources
# take effect without rebuilding.
build = "colcon build --symlink-install"

# colcon writes a POSIX `source`-able setup script, which pixi's built-in task
# shell does not implement — so these tasks shell out to bash explicitly.
demo = { cmd = "bash -c 'source install/setup.bash && ros2 launch rviz_basics marker_demo.launch.py'", depends-on = [
  "build",
] }

# Run just the node, no RViz (useful when RViz is already open).
node = { cmd = "bash -c 'source install/setup.bash && ros2 run rviz_basics marker_publisher'", depends-on = [
  "build",
] }

# Run the package's tests.
test = { cmd = "bash -c 'source install/setup.bash && colcon test --packages-select rviz_basics --event-handlers console_direct+ && colcon test-result --verbose'", depends-on = [
  "build",
] }

# Drop into a shell with the workspace overlay already sourced.
shell = "bash -c 'source install/setup.bash && exec bash'"

clean = "rm -rf build install log"
