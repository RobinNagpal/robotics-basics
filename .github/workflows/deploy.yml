name: Deploy docs

# The site is a static export and the docs are read when it is built, so a
# change under docs/ needs a rebuild just as much as a change to the site's own
# code does.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  # Two deploys syncing the same bucket at once would interleave, and the
  # loser's invalidation would be the one that ran last.
  group: deploy-docs
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_URL: https://docs.dodao.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build the static export
        working-directory: website
        run: |
          npm ci
          npm run build
          # A server build would also succeed and leave no out/ — catching that
          # here is cheaper than finding an empty bucket afterwards.
          test -f out/index.html
          test -f out/search-index.json
          test -f out/404.html
          echo "${{ github.sha }}" > out/_build.txt

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Assets before pages, and no --delete on this pass. A page that arrives
      # before the hashed bundle it references would be a page that 404s for as
      # long as the gap lasts; doing it this way the new bundles are already
      # there when the pages that name them appear.
      #
      # Cache-Control is set here rather than in Terraform because it is a
      # property of each object, and it governs the browser as well as the
      # edge. These names contain a hash of their contents, so a year is safe.
      - name: Upload the hashed assets
        run: |
          aws s3 sync website/out/_next/static/ "s3://${{ vars.S3_BUCKET }}/_next/static/" \
            --no-progress \
            --cache-control 'public, max-age=31536000, immutable'

      # Everything else, and this pass deletes. Pages keep their URLs when
      # their content changes, so they must always be revalidated; the edge
      # holds them, and the deploy's invalidation is what releases them.
      - name: Upload the pages and delete what has gone
        run: |
          aws s3 sync website/out/ "s3://${{ vars.S3_BUCKET }}/" \
            --no-progress --delete \
            --exclude '_next/static/*' \
            --cache-control 'public, max-age=0, must-revalidate'

      # One path, not one per URL. CloudFront counts /* as a single path
      # against an allowance of 1,000 free a month, so a full flush on every
      # deploy is the cheap option as well as the correct one.
      - name: Flush the edge cache
        id: invalidate
        run: |
          id=$(aws cloudfront create-invalidation \
                 --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
                 --paths '/*' \
                 --query 'Invalidation.Id' --output text)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "invalidation $id created"

      - name: Wait for it to finish
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "${{ steps.invalidate.outputs.id }}"

      # Checks the deployed commit rather than just a 200, so a stale edge or a
      # sync that silently uploaded nothing is caught rather than passed.
      - name: Check the right build is live
        run: |
          for attempt in $(seq 1 20); do
            live=$(curl -sS "$SITE_URL/_build.txt" 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$live" = "${{ github.sha }}" ]; then
              echo "live: $live"
              exit 0
            fi
            echo "attempt $attempt: live is '${live:-nothing}', want ${{ github.sha }}"
            sleep 5
          done
          echo "::error::$SITE_URL is not serving ${{ github.sha }}"
          exit 1
